<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveBoard · Live Simulation</title>
  <style>
    :root {
      --font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --ink: #334155;
      --ink-soft: #94a3b8;
      --line: rgba(15, 23, 42, 0.10);
      --accent: #edaf19;
      --bg: #f8fafc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #stage { position: relative; flex: 1 1 auto; min-height: 0; order: 2; }
    canvas { display: block; width: 100%; height: 100%; }

    #dock { display: contents; }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--ink-soft);
      transition: opacity 0.45s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(15, 23, 42, 0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-status { font-size: 12px; letter-spacing: 0.02em; }
    #loading-bar {
      width: 160px;
      height: 2px;
      background: rgba(15, 23, 42, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.2s;
    }
    #loading.failed .spinner { display: none; }
    #loading.failed #loading-bar { display: none; }
    #loading.failed #loading-status { color: #b91c1c; max-width: 30ch; text-align: center; line-height: 1.5; }

    .panel {
      position: absolute;
      z-index: 20;
      padding: 9px 10px 10px;
      border-radius: 6px;
      background: rgba(248, 250, 252, 0.72);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      font-size: 11px;
      color: var(--ink);
      user-select: none;
    }
    .panel-title {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .panel button {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink-soft);
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .panel button:hover { color: var(--ink); border-color: rgba(15, 23, 42, 0.25); }
    .panel button.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    #platforms {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 7px;
      max-width: calc(100% - 20px);
      overflow-x: auto;
    }
    #robot-list { display: flex; flex-direction: row; gap: 4px; }
    #robot-list button { white-space: nowrap; text-align: center; padding: 5px 11px; }
    #robot-list button small {
      display: block;
      font-size: 8.5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    #modules { top: 58px; left: 12px; width: 178px; }
    #task-select {
      width: 100%;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      cursor: pointer;
    }
    #task-select:hover { border-color: rgba(15, 23, 42, 0.25); }
    #task-select option.pending { color: var(--ink-soft); }

    #view-panel { top: 58px; left: 202px; width: 176px; z-index: 30; }
    #view-row { display: flex; gap: 5px; margin-top: 7px; }
    #view-row button { flex: 1; font-family: var(--font); font-size: 9.5px;
      padding: 4px 5px; border: 1px solid var(--line); border-radius: 5px;
      background: rgba(255, 255, 255, 0.7); color: var(--ink); cursor: pointer; }
    #view-msg { margin-top: 6px; font-size: 9px; color: var(--ink-soft);
      overflow-wrap: anywhere; }

    #place-panel { top: 58px; left: 202px; width: 176px; z-index: 30; }
    #place-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; }
    #place-grid label { display: flex; flex-direction: column; font-size: 9px;
      color: var(--ink-soft); gap: 2px; }
    #place-grid input { font-family: var(--font); font-size: 10px; padding: 3px 4px;
      border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
    #place-row { display: flex; gap: 5px; margin-top: 7px; }
    #place-row button { flex: 1; font-family: var(--font); font-size: 9.5px;
      padding: 4px 5px; border: 1px solid var(--line); border-radius: 4px;
      background: rgba(255,255,255,0.8); color: var(--ink); cursor: pointer; }
    #place-row button:hover { border-color: rgba(15, 23, 42, 0.3); }
    #place-msg { margin-top: 6px; font-size: 9px; line-height: 1.4; color: var(--ink-soft);
      min-height: 12px; word-break: break-word; }
    #task-readout {
      margin-top: 7px;
      font-size: 10px;
      line-height: 1.5;
      color: var(--ink-soft);
      min-height: 4.4em;
    }
    #task-readout b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

    #motion { bottom: 12px; right: 12px; width: 152px; text-align: right; }
    #motion-row { display: flex; gap: 3px; justify-content: flex-end; }
    #motion-row button { flex: 1; }
    #progress {
      margin-top: 5px;
      height: 2px;
      border-radius: 2px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    #progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }
    .panel button:disabled { opacity: 0.4; cursor: not-allowed; }
    .panel button:disabled:hover { color: var(--ink-soft); border-color: var(--line); }

    #live {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px 5px 9px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      pointer-events: none;
      user-select: none;
    }
    #live .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.2s ease-in-out infinite;
    }
    #live .hint {
      font-weight: 400;
      font-size: 10px;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink-soft);
      margin-left: 3px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 5px 2px rgba(239, 68, 68, 0.55); }
      50% { opacity: 0.65; box-shadow: 0 0 9px 4px rgba(239, 68, 68, 0.25); }
    }

    #hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 5px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 10.5px;
      color: var(--ink);
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    @media (max-width: 560px) {
      .panel {
        position: static;
        transform: none;
        width: auto;
        max-width: none;
        border-radius: 0;
        background: rgba(248, 250, 252, 0.94);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .panel-title { display: none; }

      .panel button {
        padding: 7px 10px;
        font-size: 10.5px;
        min-height: 30px;
      }

      #platforms {
        order: 1;
        flex: 0 0 auto;
        transform: none;
        max-width: none;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);

        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent);
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent);
      }
      #platforms::-webkit-scrollbar { display: none; }
      #robot-list button { padding: 6px 10px; font-size: 10px; }
      #robot-list button small { display: none; }

      #dock {
        order: 3;
        flex: 0 0 auto;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        border-top: 1px solid var(--line);
        background: rgba(248, 250, 252, 0.94);
      }

      #modules { width: auto; min-width: 0; padding: 7px 8px; }
      #task-select { min-width: 160px; }
      #task-readout { display: none; }

      #motion { width: auto; text-align: left; padding: 0 8px 8px; }
      #motion-row { gap: 6px; }
      #motion-row button { flex: 1 1 0; min-height: 34px; text-align: center; }

      #progress {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        margin: 0;
        border-radius: 0;
      }

      #live { bottom: 8px; left: 8px; padding: 4px 8px; }
      #live .hint { display: none; }
      #hint { bottom: 10px; font-size: 9.5px; padding: 4px 10px; }
    }

    @media (max-height: 430px) and (min-width: 561px) {
      #platforms { top: 6px; padding: 4px 5px; }
      #robot-list button small { display: none; }
      #modules { top: 40px; left: 8px; width: 140px; }
      #task-readout { display: none; }
      #motion { bottom: 8px; right: 8px; width: 130px; }
      #live { bottom: 8px; left: 8px; }
      #hint { bottom: 52px; }
      .panel button { padding: 4px 7px; }
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="stage">
      <div id="live"><span class="dot"></span>Live physics<span class="hint">MuJoCo · WebAssembly</span></div>
      <div id="hint">Drag to orbit · scroll to zoom</div>
    </div>

    <div class="panel" id="platforms">
      <div id="robot-list"></div>
    </div>

    <div id="dock">
      <div class="panel" id="modules">
        <div class="panel-title">Task</div>
        <select id="task-select" aria-label="Task"></select>
        <div id="task-readout">Pick a task. The arm runs a fixed trajectory for it.</div>
      </div>

      <div class="panel" id="motion">
        <div class="panel-title">Playback</div>
        <div id="motion-row">
          <button id="play">Play</button>
          <button id="reset">Reset</button>
        </div>
        <div id="progress"><span></span></div>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-bar"><span></span></div>
      <div id="loading-status">Starting MuJoCo…</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from './vendor/STLLoader.js';
    import { OrbitControls } from './vendor/OrbitControls.js';
    import loadMujoco from './vendor/mujoco.js';

    const MODEL_BASE = './models/';

    const MJ_OBJ_BODY = 1;
    const MJ_OBJ_JOINT = 3;
    const MJ_OBJ_GEOM = 5;
    const MJ_OBJ_MATERIAL = 14;
    const MJ_JNT_SLIDE = 2;
    const MJ_GEOM_PLANE = 0;
    const MJ_GEOM_SPHERE = 2;
    const MJ_GEOM_CAPSULE = 3;
    const MJ_GEOM_CYLINDER = 5;
    const MJ_GEOM_BOX = 6;
    const MJ_GEOM_MESH = 7;

    let mujoco, mjModel, mjData;
    let scene, camera, renderer, controls;
    let mujocoRoot = null;
    let bodies = {};
    let bodyNames = [];
    let jointNames = [];

    let catalogue = [];
    let robot = null;
    let gripCtrl = 0;
    let gripQposIndex = -1;
    let spinIndex = -1;
    let homeView = null;
    let trajectories = {};
    let task = null;
    let demoStateQposAddrs = [];
    let demoCollisionState = null;
    let devObjectPose = null;
    let playing = false;
    let sampleIndex = 0;
    let subStep = 0;
    let stepsPerSample = 10;
    let restGrip = 0;
    let devHold = false;
    let devPose = null;

    let pathLine = null;
    let pathMarker = null;
    let boardCentre = null;
    let previewItem = null;

    const TASK_CATALOGUE = [
      { key: 'high-valve',     label: 'Gate Valve (Large)' },
      { key: 'small-valve',    label: 'Gate Valve (Small)' },
      { key: 'thread-m30',     label: 'Thread M30' },
      { key: 'thread-m8',      label: 'Thread M8' },
      { key: 'peg-insertion',  label: 'Peg Insertion Plate' },
      { key: 'breaker',        label: 'Circuit Breaker' },
      { key: 'button-cover',   label: 'Hidden Push Button' },
      { key: 'valve',          label: 'Ball Valve' },
      { key: 'key-lock',       label: 'Lock and Key' },
      { key: 'lamp',           label: 'Light Bulb Socket' },
      { key: 'drawer',         label: 'Sliding Drawer' },
      { key: 'shock-absorber', label: 'Shock Absorber' },
    ];

    // Every task now has its module in the scene, keyed by its own name, and
    // only the one under test is shown.
    for (const item of TASK_CATALOGUE) { item.traj = item.key; item.module = item.key; }

    const MODULE_PREFIXES = TASK_CATALOGUE.map((item) => item.key);

    const MODULE_STL_BASE = './parts/';

    const MODULE_PREVIEW = {
      'high-valve': {
        base: ['torque_based/High_Torque_Valve_Base.stl'],
        move: ['torque_based/High_Torque_Valve_Screw.stl'],
        demo: { spin: Math.PI, secs: 1.8 },
      },
      'small-valve': {
        base: ['torque_based/Small_Valve_Base.stl'],
        move: ['torque_based/Small_Valve_Screw.stl'],
        demo: { spin: Math.PI, secs: 1.8 },
      },
      'thread-m30': {
        base: ['torque_based/M30_Screw_Base.stl'],
        move: ['torque_based/M30_Nut.stl'],
        demo: { spin: 4 * Math.PI, move: [0, 0, 35], secs: 3 },
      },
      'thread-m8': {
        base: ['torque_based/M8_Screw_Base.stl'],
        move: ['torque_based/M8_Nut.stl'],
        demo: { spin: 4 * Math.PI, move: [0, 0, 28], secs: 3 },
      },
      'peg-insertion': {
        base: ['composed_assembly/Shock_Absorber_Base.stl'],
        move: ['composed_assembly/Shock_Absorber_Pin.stl'],
        demo: { spin: 3 * Math.PI, move: [0, 0, 30], secs: 3 },
      },
      'button-cover': {
        base: ['precision_based/Button_Base.stl'],
        move: ['precision_based/Button.stl', 'composed_assembly/Button_Cover.stl'],
        demo: { swing: -0.6, move: [0, 0, -6], secs: 1.6 },
      },
      'key-lock': {
        base: ['composed_assembly/Key_Base.stl'],
        move: ['composed_assembly/Key.stl'],
        demo: { spin: Math.PI / 2, move: [0, 0, 30], secs: 2 },
      },
      'drawer': {
        base: ['composed_assembly/Drawer_Base.stl'],
        move: ['composed_assembly/Drawer.stl'],
        demo: { move: [0, 50, 0], secs: 2.2 },
      },
      'shock-absorber': {
        base: ['composed_assembly/Shock_Absorber_Base.stl'],
        move: ['composed_assembly/Shock_Absorber_Screw.stl'],
        demo: { spin: 3 * Math.PI, move: [0, 0, 30], secs: 3 },
        pair: 90,
      },
    };

    const MODULE_PLACEMENT_DEFAULT = { offset: [0, 0, 0], spin: 0, scale: 1 };
    const MODULE_PLACEMENT = {
    };
    const stlLoader = new STLLoader();
    let previewMesh = null;
    let previewDemo = null;
    let previewToken = 0;
    let previewAdjust = { offset: [0, 0, 0], spin: 0, scale: 1 };
    let committedPlacement = {};
    let savedViews = {};
    const PLACE_EDIT = new URLSearchParams(location.search).has('edit');
    const PLACE_API = new URLSearchParams(location.search).get('api')
      || 'http://localhost:8770';

    const statusEl = document.getElementById('loading-status');
    const barEl = document.querySelector('#loading-bar span');
    const overlayEl = document.getElementById('loading');
    const hintEl = document.getElementById('hint');
    const readoutEl = document.getElementById('task-readout');
    const progressEl = document.querySelector('#progress span');
    const playEl = document.getElementById('play');
    const stageEl = document.getElementById('stage');

    const coarsePointer = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

    function status(text, progress) {
      statusEl.textContent = text;
      if (progress !== undefined) barEl.style.width = `${Math.round(progress * 100)}%`;
    }

    function fail(err) {
      console.error(err);
      overlayEl.classList.add('failed');
      overlayEl.classList.remove('hidden');
      statusEl.textContent = `Could not start the simulation: ${err.message || err}`;
    }

    function getPosition(buffer, index, target) {
      return target.set(
        buffer[index * 3 + 0],
        buffer[index * 3 + 2],
        -buffer[index * 3 + 1]);
    }

    function getQuaternion(buffer, index, target) {
      return target.set(
        -buffer[index * 4 + 1],
        -buffer[index * 4 + 3],
        buffer[index * 4 + 2],
        -buffer[index * 4 + 0]);
    }

    function toThree(p) {
      return new THREE.Vector3(p[0], p[2], -p[1]);
    }

    // The page is embedded with ?v=<hash of the sim and its assets>; carrying
    // that onto every fetch means a deploy actually reaches the browser
    // instead of being served from cache.
    const CACHE_TAG = new URLSearchParams(location.search).get('v');

    async function fetchGzip(path) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('this browser cannot decompress the simulation assets');
      }
      const url = `${path}.gz` + (CACHE_TAG ? `?v=${CACHE_TAG}` : '');
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`${path}.gz → HTTP ${resp.status}`);
      const buffer = await resp.arrayBuffer();
      const head = new Uint8Array(buffer, 0, Math.min(2, buffer.byteLength));

      if (head[0] !== 0x1f || head[1] !== 0x8b) return new Uint8Array(buffer);
      const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function fetchJson(path) {
      return JSON.parse(new TextDecoder().decode(await fetchGzip(path)));
    }

    async function startMujoco() {
      status('Loading MuJoCo…', 0.05);

      const wasmBinary = await fetchGzip('./vendor/mujoco.wasm');
      status('Starting MuJoCo…', 0.35);
      mujoco = await loadMujoco({ wasmBinary });
    }

    async function loadScene() {
      status('Loading scene…', 0.4);
      const manifest = await fetchJson(`${MODEL_BASE}manifest.json`);

      const dirs = new Set(['/working']);
      for (const file of manifest) {
        const parts = file.split('/');
        let cur = '/working';
        for (let i = 0; i < parts.length - 1; i++) {
          cur += '/' + parts[i];
          dirs.add(cur);
        }
      }
      for (const dir of dirs) {
        try { mujoco.FS.mkdir(dir); } catch (_) {  }
      }

      let done = 0;
      await Promise.all(manifest.map(async (file) => {
        const bytes = await fetchGzip(MODEL_BASE + file);
        mujoco.FS.writeFile(`/working/${file}`, bytes);
        done++;
        status(`Loading scene… ${done}/${manifest.length}`, 0.4 + 0.48 * done / manifest.length);
      }));

      catalogue = await fetchJson(`${MODEL_BASE}robots.json`);

      try {
        const resp = await fetch(`${MODEL_BASE}module_placement.json`);
        committedPlacement = resp.ok ? await resp.json() : {};
      } catch (_) { committedPlacement = {}; }
    }

    // Saved views live in tools/task_views.json, which the asset build folds
    // into each trajectory.  Until that rebuild happens the file is the only
    // copy, so edit mode reads it back rather than losing the pose on reload.
    async function loadSavedViews() {
      if (!PLACE_EDIT || !robot) return;
      try {
        const resp = await fetch(`${PLACE_API}/views`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ robot: robot.name }),
        });
        const data = await resp.json();
        savedViews[robot.name] = data.views || {};
      } catch (_) { savedViews[robot.name] = savedViews[robot.name] || {}; }
      if (task && taskView()) frameTask();
      refreshViewPanel();
    }

    // Swapping platforms replaces the model, the data, and every index derived
    // from them.  The render loop must not see that half done: it steps physics
    // and indexes task.qpos and robot.arm on every frame, so a frame landing
    // between the trajectory fetch and the rebuild drives the outgoing model
    // with the incoming robot's joint counts and pose -- the arm on screen
    // flails or folds before the new one appears.  So park the loop, fetch
    // before mutating anything, and drop the stale task with the model it
    // belonged to.
    async function loadRobot(entry) {
      const wasRunning = running;
      stop();
      try {
        await loadRobotUnsafe(entry);
      } finally {
        if (wasRunning) start();
      }
    }

    async function loadRobotUnsafe(entry) {
      const nextTrajectories = await fetchJson(`${MODEL_BASE}${entry.traj}`);

      robot = entry;
      trajectories = nextTrajectories;
      // Belongs to the outgoing model: its qpos layout does not survive here.
      task = null;
      demoStateQposAddrs = [];

      const priorModel = mjModel;
      const priorData = mjData;
      mjModel = mujoco.MjModel.from_xml_path(`/working/${entry.scene}`);
      mjData = new mujoco.MjData(mjModel);
      // Emscripten owns these; without the explicit free every switch leaks a
      // whole model and its data in the wasm heap.
      for (const stale of [priorData, priorModel]) {
        try { stale?.delete?.(); } catch (_) {  }
      }

      demoCollisionState = null;

      bodyNames = [];
      for (let b = 0; b < mjModel.nbody; b++) {
        bodyNames[b] = mujoco.mj_id2name(mjModel, MJ_OBJ_BODY, b) || '';
      }
      jointNames = [];
      for (let j = 0; j < mjModel.njnt; j++) {
        jointNames[j] = mujoco.mj_id2name(mjModel, MJ_OBJ_JOINT, j) || '';
      }
      gripCtrl = entry.gripIndex;
      const gripJointId = jointNames.indexOf(entry.grip.actuator);
      gripQposIndex = gripJointId >= 0 ? mjModel.jnt_qposadr[gripJointId] : -1;
      spinIndex = entry.spinIndex ?? -1;
      restGrip = entry.grip.open;

      const rate = Object.values(trajectories)[0]?.rate ?? 50;
      stepsPerSample = Math.max(Math.round((1 / rate) / mjModel.opt.timestep), 1);

      const centre = toThree(entry.view.centre);
      const reach = entry.view.span;
      homeView = {
        target: centre.clone(),
        position: centre.clone().add(new THREE.Vector3(0.62, 0.42, 0.66)
          .normalize().multiplyScalar(reach * 1.15)),
      };
      controls.minDistance = reach * 0.12;
      controls.maxDistance = reach * 3.0;

      resetScene();
      buildBodies();
      lookAt(homeView.target, homeView.position);
      buildTaskList();
      loadSavedViews();
    }

    function buildScene() {
      status('Building view…', 0.96);
      const stage = document.getElementById('stage');
      const w = stage.clientWidth;
      const h = stage.clientHeight;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, coarsePointer ? 1.5 : 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      stage.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf8fafc);
      scene.fog = new THREE.Fog(0xf8fafc, 3.5, 9);

      camera = new THREE.PerspectiveCamera(42, w / h, 0.01, 20);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.09;
      controls.minDistance = 0.25;
      controls.maxDistance = 3.5;
      controls.maxPolarAngle = Math.PI * 0.495;

      if (coarsePointer) {

        controls.touches.ONE = null;
        controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;

        renderer.domElement.style.touchAction = 'pan-y';
        hintEl.textContent = 'Two fingers to orbit · pinch to zoom';
      }

      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      const key = new THREE.DirectionalLight(0xffffff, 1.7);
      key.position.set(1.6, 3.2, 2.2);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 8;
      key.shadow.camera.left = -1.2;
      key.shadow.camera.right = 1.2;
      key.shadow.camera.top = 1.2;
      key.shadow.camera.bottom = -1.2;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.35);
      fill.position.set(-1.8, 1.2, -1.4);
      scene.add(fill);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.ShadowMaterial({ opacity: 0.13 }));
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(4, 24, 0xcbd5e1, 0xe2e8f0);
      grid.position.y = 0.001;
      scene.add(grid);

      buildPathVisual();
    }

    function lookAt(target, position) {
      camera.position.copy(position);
      controls.target.copy(target);
      camera.lookAt(target);
      controls.update();
    }

    function buildPathVisual() {
      pathLine = new THREE.Line(
        new THREE.BufferGeometry(),
        new THREE.LineBasicMaterial({ color: 0xedaf19, transparent: true, opacity: 0.85 }));
      pathLine.visible = false;
      pathLine.frustumCulled = false;
      scene.add(pathLine);

      pathMarker = new THREE.Mesh(
        new THREE.SphereGeometry(0.006, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0xd97706 }));
      pathMarker.visible = false;
      scene.add(pathMarker);
    }

    function buildBodies() {

      if (mujocoRoot) {
        mujocoRoot.traverse((node) => {
          if (node.isMesh) { node.geometry.dispose(); node.material.dispose(); }
        });
        scene.remove(mujocoRoot);
      }
      bodies = {};

      const geometries = {};
      const root = new THREE.Group();
      root.name = 'MuJoCo root';
      mujocoRoot = root;
      scene.add(root);

      for (let g = 0; g < mjModel.ngeom; g++) {
        if (mjModel.geom_group[g] >= 3) continue;

        const b = mjModel.geom_bodyid[g];
        const type = mjModel.geom_type[g];
        const size = [
          mjModel.geom_size[g * 3 + 0],
          mjModel.geom_size[g * 3 + 1],
          mjModel.geom_size[g * 3 + 2],
        ];

        if (!(b in bodies)) {
          bodies[b] = new THREE.Group();
          bodies[b].bodyID = b;
        }

        let geometry;
        if (type === MJ_GEOM_PLANE) {
          continue;
        } else if (type === MJ_GEOM_SPHERE) {
          geometry = new THREE.SphereGeometry(size[0], 24, 16);
        } else if (type === MJ_GEOM_CAPSULE) {
          geometry = new THREE.CapsuleGeometry(size[0], size[1] * 2, 12, 20);
        } else if (type === MJ_GEOM_CYLINDER) {
          geometry = new THREE.CylinderGeometry(size[0], size[0], size[1] * 2, 24);
        } else if (type === MJ_GEOM_BOX) {
          geometry = new THREE.BoxGeometry(size[0] * 2, size[2] * 2, size[1] * 2);
        } else if (type === MJ_GEOM_MESH) {
          const meshID = mjModel.geom_dataid[g];
          if (meshID < 0) continue;
          if (!(meshID in geometries)) geometries[meshID] = meshGeometry(meshID);
          geometry = geometries[meshID].clone();
        } else {
          continue;
        }

        const mesh = new THREE.Mesh(geometry, geomMaterial(g));
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        getPosition(mjModel.geom_pos, g, mesh.position);
        getQuaternion(mjModel.geom_quat, g, mesh.quaternion);
        bodies[b].add(mesh);
      }

      for (let b = 0; b < mjModel.nbody; b++) {
        if (!(b in bodies)) bodies[b] = Object.assign(new THREE.Group(), { bodyID: b });
        root.add(bodies[b]);
      }
      syncBodies();

      boardCentre = new THREE.Vector3();
      let panels = 0;
      for (let b = 1; b < mjModel.nbody; b++) {
        if (!(mujoco.mj_id2name(mjModel, MJ_OBJ_BODY, b) || '').startsWith('panel_')) continue;
        boardCentre.add(bodies[b].position);
        panels++;
      }
      if (panels) boardCentre.divideScalar(panels);
      else boardCentre.copy(homeView.target);
    }

    function meshGeometry(meshID) {
      const geometry = new THREE.BufferGeometry();

      const verts = new Float32Array(mjModel.mesh_vert.subarray(
        mjModel.mesh_vertadr[meshID] * 3,
        (mjModel.mesh_vertadr[meshID] + mjModel.mesh_vertnum[meshID]) * 3));
      for (let v = 0; v < verts.length; v += 3) {
        const y = verts[v + 1];
        verts[v + 1] = verts[v + 2];
        verts[v + 2] = -y;
      }

      const faces = new Int32Array(mjModel.mesh_face.subarray(
        mjModel.mesh_faceadr[meshID] * 3,
        (mjModel.mesh_faceadr[meshID] + mjModel.mesh_facenum[meshID]) * 3));

      geometry.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geometry.setIndex(Array.from(faces));
      geometry.computeVertexNormals();
      return geometry;
    }

    function geomMaterial(g) {
      const matID = mjModel.geom_matid[g];
      const rgba = matID !== -1
        ? [mjModel.mat_rgba[matID * 4 + 0], mjModel.mat_rgba[matID * 4 + 1],
           mjModel.mat_rgba[matID * 4 + 2], mjModel.mat_rgba[matID * 4 + 3]]
        : [mjModel.geom_rgba[g * 4 + 0], mjModel.geom_rgba[g * 4 + 1],
           mjModel.geom_rgba[g * 4 + 2], mjModel.geom_rgba[g * 4 + 3]];

      const matName = matID !== -1 ? (mujoco.mj_id2name(mjModel, MJ_OBJ_MATERIAL, matID) || '').toLowerCase() : '';
      let roughness = 0.40;
      let metalness = 0.10;
      let clearcoat = 0.05;

      if (matName.includes('metal') || matName.includes('shank') || matName.includes('handle')) {
        roughness = 0.28;
        metalness = 0.70;
      } else if (matName.includes('carbon') || matName.includes('thigh') || matName.includes('dark')) {
        roughness = 0.35;
        metalness = 0.20;
        clearcoat = 0.15;
      } else if (matName.includes('top_shell') || matName.includes('drive') || matName.includes('hatch') || matName.includes('shell')) {
        roughness = 0.25;
        metalness = 0.08;
        clearcoat = 0.40;
      } else if (matName.includes('accent') || matName.includes('yellow')) {
        roughness = 0.25;
        metalness = 0.25;
        clearcoat = 0.25;
      }

      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(rgba[0], rgba[1], rgba[2]),
        transparent: rgba[3] < 1,
        opacity: rgba[3],
        roughness: roughness,
        metalness: metalness,
        clearcoat: clearcoat,
      });
    }

    function syncBodies() {
      for (let b = 0; b < mjModel.nbody; b++) {
        if (!(b in bodies)) continue;
        getPosition(mjData.xpos, b, bodies[b].position);
        getQuaternion(mjData.xquat, b, bodies[b].quaternion);
      }
    }

    // The module is demonstrated, not manipulated: it plays the motion the
    // trajectory authored rather than waiting to be shoved by the arm.  That
    // holds whether or not the clip is running, so a paused module stays put
    // instead of sagging back under gravity.
    function applyDemoSample() {
      if (!task || !task.demo || !task.stateQpos?.[sampleIndex]) return false;
      const state = task.stateQpos[sampleIndex];
      for (const adr of demoStateQposAddrs) {
        if (adr < state.length) {
          mjData.qpos[adr] = state[adr];
          mjData.qvel[adr] = 0;
        }
      }
      if (!playing) return true;

      const target = task.qpos[sampleIndex];
      for (let i = 0; i < robot.arm; i++) {
        mjData.qpos[i] = target[i];
        mjData.qvel[i] = 0;
      }
      if (gripQposIndex >= 0) {
        mjData.qpos[gripQposIndex] = task.grip[sampleIndex];
        mjData.qvel[gripQposIndex] = 0;
      }
      if (spinIndex >= 0) {
        mjData.qpos[spinIndex] = task.spin || 0;
        mjData.qvel[spinIndex] = 0;
      }
      return true;
    }

    function applyControl() {
      // A platform with no trajectory for this module can still pose its arm
      // toward the cell -- taskHome[key] in robots.json, keyed by catalogue id.
      const idleHome = (previewItem && robot.taskHome
        && robot.taskHome[previewItem.key]) || robot.home;
      const target = devPose ? devPose.qpos : (task && (playing || devHold)
        ? task.qpos[sampleIndex] : idleHome);
      if (devObjectPose && task && !playing) {
        const prefix = `${task.watch.split('_')[0]}_`;
        let oi = 0;
        for (let jid = 0; jid < mjModel.njnt && oi < devObjectPose.length; jid++) {
          const name = mjModel.joint(jid).name;
          if (name && name.startsWith(prefix)) {
            mjData.qpos[mjModel.jnt_qposadr[jid]] = devObjectPose[oi++];
          }
        }
      }
      if (task && task.demo && playing && task.stateQpos?.[sampleIndex]) {

        applyDemoSample();
      }
      for (let i = 0; i < robot.arm; i++) mjData.ctrl[i] = target[i];

      mjData.ctrl[gripCtrl] = devPose
        ? devPose.grip
        : task && (playing || devHold)
        ? task.grip[sampleIndex] : restGrip;
    }

    function resetScene() {
      mujoco.mj_resetDataKeyframe(mjModel, mjData, 0);

      if (spinIndex >= 0) mjData.qpos[spinIndex] = task ? (task.spin || 0) : 0;
      mujoco.mj_forward(mjModel, mjData);
      sampleIndex = 0;
      subStep = 0;
      devPose = null;
      devObjectPose = null;
      restGrip = robot ? robot.grip.open : 0;
      if (mjModel) syncBodies();
    }

    // Every swappable module sits in the same board cell, so all twelve are
    // in the scene at once and only the one under test is drawn.  This runs
    // live physics, so hiding the others is not enough: their collision has
    // to go too, or the arm reaching for one task is fouled by a module it
    // cannot see.  The trajectories were solved under exactly this masking.
    function moduleCollisions(live) {
      if (!mjModel) return;
      if (!demoCollisionState) {
        demoCollisionState = {
          contype: Array.from(mjModel.geom_contype),
          conaffinity: Array.from(mjModel.geom_conaffinity),
        };
      }
      mjModel.geom_contype.set(demoCollisionState.contype);
      mjModel.geom_conaffinity.set(demoCollisionState.conaffinity);
      if (live === undefined) return;

      for (let g = 0; g < mjModel.ngeom; g++) {
        const name = bodyNames[mjModel.geom_bodyid[g]] || '';
        const prefix = MODULE_PREFIXES.find((p) => name.startsWith(`${p}_`));
        if (prefix && prefix !== live) {
          mjModel.geom_contype[g] = 0;
          mjModel.geom_conaffinity[g] = 0;
        }
      }
    }

    function setDemoCollisions(disabled) {
      if (!mjModel) return;
      if (disabled) {
        moduleCollisions();
        mjModel.geom_contype.fill(0);
        mjModel.geom_conaffinity.fill(0);
      } else {
        moduleCollisions(modulePrefix() || undefined);
      }
    }

    function teleportSample() {
      if (!mjModel || !task) return;
      const saved = task.stateQpos?.[sampleIndex];
      if (saved && saved.length === mjModel.nq) {
        mjData.qpos.set(saved);
      } else {

        for (let i = 0; i < robot.arm; i++) mjData.qpos[i] = task.qpos[sampleIndex][i];
      }
      mjData.qvel.fill(0);
      mujoco.mj_forward(mjModel, mjData);
      syncBodies();
    }

    function modulePrefix() {
      return task ? task.watch.split('_')[0] : null;
    }

    function taskKey() {
      const item = TASK_CATALOGUE.find((t) => trajectories[t.traj] === task);
      return item ? item.key : (task ? modulePrefix() : null);
    }

    function taskView() {
      const key = taskKey();
      if (!key) return null;
      return (savedViews[robot?.name] || {})[key] || task?.view || null;
    }

    function selectTask(key, { dolly = true, play = true } = {}) {
      task = trajectories[key];
      const prefix = `${modulePrefix()}_`;
      demoStateQposAddrs = [];
      for (let jid = 0; jid < jointNames.length; jid++) {
        if (jointNames[jid].startsWith(prefix)) {
          demoStateQposAddrs.push(mjModel.jnt_qposadr[jid]);
        }
      }
      previewItem = null;
      clearModulePreview();
      const catItem = TASK_CATALOGUE.find((t) => t.traj === key);
      const select = document.getElementById('task-select');
      if (select && catItem) select.value = catItem.key;

      resetScene();
      setModuleVisibility(modulePrefix());
      setDemoCollisions(!!task.demo);
      refreshViewPanel();
      drawPath();
      if (dolly) frameTask();
      updateReadout();
      setPlaying(play);
      hintEl.style.opacity = '0';
    }

    function drawPath() {
      if (!task) {
        pathLine.visible = false;
        pathMarker.visible = false;
        return;
      }
      pathLine.geometry.dispose();
      pathLine.geometry = new THREE.BufferGeometry().setFromPoints(task.tcp.map(toThree));
      pathLine.visible = true;
      pathMarker.visible = true;
    }

    function setTrajectoryPending(pending) {
      if (pathLine) pathLine.visible = !pending && !!task;
      if (pathMarker) pathMarker.visible = !pending && !!task;
    }

    function replaceTrajectory(name, replacement) {
      if (!replacement) return;
      trajectories[name] = replacement;
      if (task && modulePrefix() === name) {
        task = replacement;
        setDemoCollisions(!!task.demo);
      }
    }

    function frameTask() {
      if (!task) {
        lookAt(homeView.target, homeView.position);
        return;
      }
      // A view saved for this task in the editor beats the computed framing.
      const saved = taskView();
      if (saved) {
        lookAt(new THREE.Vector3(...saved.target),
               new THREE.Vector3(...saved.position));
        return;
      }
      const prefix = modulePrefix();
      const focus = new THREE.Vector3();
      let n = 0;
      for (let b = 1; b < mjModel.nbody; b++) {
        if (!bodyNames[b].startsWith(`${prefix}_`)) continue;
        focus.add(bodies[b].position);
        n++;
      }
      if (!n) return;
      focus.divideScalar(n);
      focus.y += 0.03;

      if (robot.framing === 'side') {

        const span = robot.view.span;
        const base = bodies[1] ? bodies[1].position.clone().setY(0) : new THREE.Vector3();
        const toward = focus.clone().setY(0).sub(base);
        if (toward.lengthSq() < 1e-6) toward.set(1, 0, 0);
        toward.normalize();
        const flank = new THREE.Vector3(0, 1, 0).cross(toward);

        const face = toThree(robot.boardNormal).setY(0).normalize();
        const dir = face.multiplyScalar(0.55).add(flank.multiplyScalar(0.85)).normalize();

        const centre = focus.clone().lerp(
          new THREE.Vector3(base.x, focus.y, base.z), 0.10);
        lookAt(centre, centre.clone().add(
          dir.multiplyScalar(span * 0.40).setY(span * 0.14)));
        return;
      }

      const dir = focus.clone().setY(0)
        .sub(boardCentre.clone().setY(0)).multiplyScalar(4)
        .add(new THREE.Vector3(0.55, 0, 0)).normalize();

      const offset = dir.multiplyScalar(0.40).setY(0.15);
      lookAt(focus, focus.clone().add(offset));
    }

    function setModuleVisibility(activePrefix) {
      if (!mjModel) return;
      for (let b = 1; b < mjModel.nbody; b++) {
        const name = bodyNames[b] || '';
        const prefix = MODULE_PREFIXES.find((p) => name.startsWith(`${p}_`));
        if (prefix && (b in bodies)) bodies[b].visible = prefix === activePrefix;
      }
      moduleCollisions(activePrefix || undefined);
    }

    function previewDemoStep(time) {
      if (!previewDemo) return;
      const { groups, cfg, start } = previewDemo;
      if (task) {
        for (const g of groups) { g.position.set(0, 0, 0); g.rotation.set(0, 0, 0); }
        return;
      }
      const secs = cfg.secs || 2.5;
      const p = (((time - start) / 1000) % (2 * secs)) / secs;
      const tri = p < 1 ? p : 2 - p;
      const e = tri * tri * (3 - 2 * tri);
      const m = cfg.move || [0, 0, 0];
      for (const g of groups) {
        g.position.set(e * m[0], e * m[1], e * m[2]);
        g.rotation.set(e * (cfg.swing || 0), 0, e * (cfg.spin || 0));
      }
    }

    function clearModulePreview() {
      previewToken++;
      previewDemo = null;
      refreshPlacePanel();
      if (!previewMesh) return;
      previewMesh.traverse((n) => {
        if (n.isMesh) { n.geometry.dispose(); n.material.dispose(); }
      });
      scene.remove(previewMesh);
      previewMesh = null;
    }

    function boardAnchor() {
      const anchor = new THREE.Vector3();
      let n = 0;
      for (let b = 1; b < mjModel.nbody; b++) {
        const nm = bodyNames[b] || '';
        if (MODULE_PREFIXES.some((p) => nm.startsWith(`${p}_`))) {
          anchor.add(bodies[b].position);
          n++;
        }
      }
      if (n) return anchor.divideScalar(n);
      return (boardCentre || homeView.target).clone();
    }

    function boardFrame() {
      const normal = toThree(robot.boardNormal).normalize();
      const up = Math.abs(normal.y) > 0.9
        ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(up, normal).normalize();
      up.crossVectors(normal, right).normalize();
      return { normal, right, up };
    }

    function placeModulePreview() {
      if (!previewMesh) return;
      const group = previewMesh;
      const adj = previewAdjust;
      const { normal, right, up } = boardFrame();
      const anchor = boardAnchor();

      if (previewDemo) for (const g of previewDemo.groups) {
        g.position.set(0, 0, 0); g.rotation.set(0, 0, 0);
      }
      group.position.set(0, 0, 0);
      group.scale.setScalar(0.001 * (adj.scale || 1));
      group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
      group.quaternion.premultiply(
        new THREE.Quaternion().setFromAxisAngle(normal, adj.spin || 0));
      group.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(group);
      const c = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const halfN = 0.5 * (Math.abs(size.x * normal.x)
        + Math.abs(size.y * normal.y) + Math.abs(size.z * normal.z));
      const off = adj.offset || [0, 0, 0];

      group.position
        .addScaledVector(right, anchor.dot(right) - c.dot(right) + off[0])
        .addScaledVector(up, anchor.dot(up) - c.dot(up) + off[1])
        .addScaledVector(normal,
          anchor.dot(normal) + 0.003 - (c.dot(normal) - halfN) + off[2]);
    }

    async function showModulePreview(key) {
      clearModulePreview();
      const parts = MODULE_PREVIEW[key];
      if (!parts) {
        lookAt(homeView.target, homeView.position);
        return;
      }
      const token = previewToken;

      const baseMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0.925, 0.933, 0.945),
        roughness: 0.45, metalness: 0.08, clearcoat: 0.06,
      });
      const moveMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0.929, 0.686, 0.098),
        roughness: 0.45, metalness: 0.08, clearcoat: 0.06,
      });
      const load = (list) => Promise.all((list || []).map(
        (p) => stlLoader.loadAsync(MODULE_STL_BASE + p).catch(() => null)));
      const [baseGeoms, moveGeoms] = await Promise.all([load(parts.base), load(parts.move)]);
      if (token !== previewToken) {
        [...baseGeoms, ...moveGeoms].forEach((g) => g && g.dispose());
        return;
      }

      const meshOf = (geo, mat) => {
        const m = new THREE.Mesh(geo, mat);
        m.castShadow = true;
        m.receiveShadow = true;
        return m;
      };

      const moveGroups = [];
      const assemble = () => {
        const asm = new THREE.Group();
        for (const geo of baseGeoms) if (geo) asm.add(meshOf(geo, baseMat));
        const mv = new THREE.Group();
        for (const geo of moveGeoms) if (geo) mv.add(meshOf(geo, moveMat));
        asm.add(mv);
        moveGroups.push(mv);
        return asm;
      };

      const group = new THREE.Group();
      if (parts.pair) {
        const a = assemble(); a.position.x = -parts.pair / 2;
        const b = assemble(); b.position.x = parts.pair / 2;
        group.add(a, b);
      } else {
        group.add(assemble());
      }
      if (!baseGeoms.some(Boolean) && !moveGeoms.some(Boolean)) {
        lookAt(homeView.target, homeView.position);
        return;
      }

      scene.add(group);
      previewMesh = group;
      previewDemo = parts.demo
        ? { groups: moveGroups, cfg: parts.demo, start: performance.now() }
        : null;
      previewAdjust = loadPreviewAdjust(key);
      placeModulePreview();

      const anchor = boardAnchor();
      const span = new THREE.Box3().setFromObject(group).getSize(new THREE.Vector3()).length();
      const dir = homeView.position.clone().sub(homeView.target).normalize();
      const look = anchor.clone().setY(anchor.y + span * 0.15);
      lookAt(look, look.clone().add(dir.multiplyScalar(Math.max(span * 2.2, 0.35))));
      refreshPlacePanel();
    }

    function loadPreviewAdjust(key) {

      const src = (committedPlacement[robot?.name] || {})[key]
        || MODULE_PLACEMENT[key] || MODULE_PLACEMENT_DEFAULT;
      return {
        offset: [...(src.offset || [0, 0, 0])],
        spin: src.spin || 0,
        scale: src.scale || 1,
      };
    }

    let viewPanel = null;

    // Edit mode only: park the camera where you want a task framed and save
    // it.  The pose is written to tools/task_views.json, which the asset
    // build folds into the trajectory so the deployed sim opens there too.
    function buildViewPanel() {
      const el = document.createElement('div');
      el.className = 'panel';
      el.id = 'view-panel';
      el.hidden = true;
      el.innerHTML = `
        <div class="panel-title">Camera view</div>
        <div id="view-row">
          <button id="view-save">Save view</button>
          <button id="view-clear">Clear</button>
        </div>
        <div id="view-msg"></div>`;
      document.body.appendChild(el);
      el.querySelector('#view-save').addEventListener('click', () => saveTaskView(true));
      el.querySelector('#view-clear').addEventListener('click', () => saveTaskView(false));
      return { el, msg: el.querySelector('#view-msg') };
    }

    function refreshViewPanel() {
      if (!viewPanel) return;
      const show = PLACE_EDIT && !!task;
      viewPanel.el.hidden = !show;
      if (!show) return;
      const key = taskKey();
      viewPanel.el.querySelector('.panel-title').textContent = `Camera view · ${key}`;
      if (!viewPanel.msg.dataset.busy) {
        viewPanel.msg.textContent = taskView() ? 'saved view in use' : 'no saved view';
      }
    }

    async function saveTaskView(keep) {
      const key = taskKey();
      if (!key || !robot) return;
      const body = { robot: robot.name, task: key };
      if (keep) {
        body.target = controls.target.toArray();
        body.position = camera.position.toArray();
      }
      viewPanel.msg.dataset.busy = '1';
      viewPanel.msg.textContent = keep ? 'saving…' : 'clearing…';
      try {
        const resp = await fetch(`${PLACE_API}/view-save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        savedViews[robot.name] = data.views || {};
        if (task) { if (data.view) task.view = data.view; else delete task.view; }
        viewPanel.msg.textContent = keep ? `saved → ${data.saved}` : 'cleared';
      } catch (err) {
        viewPanel.msg.textContent = `no answer from ${PLACE_API} — is traj_edit.py running?`;
      }
      delete viewPanel.msg.dataset.busy;
    }

    let placePanel = null;

    function buildPlacePanel() {
      const el = document.createElement('div');
      el.className = 'panel';
      el.id = 'place-panel';
      el.hidden = true;
      el.innerHTML = `
        <div class="panel-title">Module placement</div>
        <div id="place-grid"></div>
        <div id="place-row">
          <button id="place-save">Save forever</button>
          <button id="place-reset">Reset</button>
        </div>
        <div id="place-msg"></div>`;
      document.body.appendChild(el);
      const grid = el.querySelector('#place-grid');
      const fields = {};
      const add = (name, label, step, get, set) => {
        const wrap = document.createElement('label');
        wrap.textContent = label;
        const input = document.createElement('input');
        input.type = 'number';
        input.step = step;
        input.addEventListener('input', () => {
          const v = parseFloat(input.value);
          if (Number.isFinite(v)) { set(v); placeModulePreview(); }
        });
        wrap.appendChild(input);
        grid.appendChild(wrap);
        fields[name] = { input, get };
      };
      add('x', 'right (m)', '0.005',
        () => previewAdjust.offset[0], (v) => { previewAdjust.offset[0] = v; });
      add('y', 'up (m)', '0.005',
        () => previewAdjust.offset[1], (v) => { previewAdjust.offset[1] = v; });
      add('z', 'out (m)', '0.005',
        () => previewAdjust.offset[2], (v) => { previewAdjust.offset[2] = v; });
      add('spin', 'spin (°)', '5',
        () => previewAdjust.spin * 180 / Math.PI,
        (v) => { previewAdjust.spin = v * Math.PI / 180; });
      add('scale', 'scale', '0.02',
        () => previewAdjust.scale, (v) => { previewAdjust.scale = v || 1; });

      el.querySelector('#place-save').addEventListener('click', savePlacementForever);
      el.querySelector('#place-reset').addEventListener('click', () => {
        previewAdjust = { offset: [0, 0, 0], spin: 0, scale: 1 };
        placeModulePreview();
        refreshPlacePanel();
      });
      return { el, fields, msg: el.querySelector('#place-msg') };
    }

    function refreshPlacePanel() {
      refreshViewPanel();
      if (!placePanel) return;

      const show = PLACE_EDIT && !!previewItem && (!task || task.armOnly);
      placePanel.el.hidden = !show;
      if (!show) return;
      placePanel.el.querySelector('.panel-title').textContent =
        `Placement · ${previewItem.label}`;
      const r = (v) => Math.round(v * 1e4) / 1e4;
      for (const f of Object.values(placePanel.fields)) {
        if (document.activeElement !== f.input) f.input.value = r(f.get());
      }
    }

    async function savePlacementForever() {
      if (!previewItem) return;
      const a = previewAdjust;
      placePanel.msg.textContent = 'saving…';
      try {
        const resp = await fetch(`${PLACE_API}/place-save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            robot: robot.name, module: previewItem.key,
            offset: a.offset, spin: a.spin, scale: a.scale,
          }),
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        committedPlacement[robot.name] = committedPlacement[robot.name] || {};
        if (data.placement) committedPlacement[robot.name][previewItem.key] = data.placement;
        else delete committedPlacement[robot.name][previewItem.key];
        placePanel.msg.textContent = `saved → ${data.saved}`;
      } catch (err) {
        placePanel.msg.textContent = `no answer from ${PLACE_API} — is traj_edit.py running?`;
      }
    }

    if (PLACE_EDIT) {
      viewPanel = buildViewPanel();
      placePanel = buildPlacePanel();
      window.addEventListener('keydown', (e) => {

        if (!previewMesh || !previewItem || task) return;
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
        const step = e.shiftKey ? 0.02 : 0.005;
        const a = previewAdjust;
        let handled = true;
        switch (e.key) {
          case 'ArrowLeft':  a.offset[0] -= step; break;
          case 'ArrowRight': a.offset[0] += step; break;
          case 'ArrowUp':    a.offset[1] += step; break;
          case 'ArrowDown':  a.offset[1] -= step; break;
          case 'PageUp':     a.offset[2] += step; break;
          case 'PageDown':   a.offset[2] -= step; break;
          case '[':          a.spin -= Math.PI / 36; break;
          case ']':          a.spin += Math.PI / 36; break;
          case '-': case '_': a.scale *= 0.98; break;
          case '=': case '+': a.scale *= 1.02; break;
          case '0': previewAdjust = { offset: [0, 0, 0], spin: 0, scale: 1 }; break;
          default: handled = false;
        }
        if (!handled) return;
        e.preventDefault();
        placeModulePreview();
        refreshPlacePanel();
      });
    }

    function previewModule(item) {
      setPlaying(false);
      task = null;
      previewItem = item;
      drawPath();
      const select = document.getElementById('task-select');
      if (select) select.value = item.key;
      resetScene();
      setModuleVisibility(item.module || null);
      showModulePreview(item.key);
      updateReadout();
      hintEl.style.opacity = '0';
    }

    function updateReadout() {
      if (!task) {
        if (previewItem && PLACE_EDIT) {
          readoutEl.textContent =
            `${previewItem.label} — reposition in the Placement panel, then Save forever`;
        } else {
          readoutEl.textContent = previewItem
            ? `${previewItem.label}: no verified trajectory for this platform yet.`
            : Object.keys(trajectories).length
            ? 'Pick a task. The arm runs a fixed trajectory for it.'
            : `${robot.label} has no verified trajectory yet — the model is here to look at.`;
        }
        return;
      }
      if (task.armOnly || !task.watch) {
        const seconds = (task.qpos.length / task.rate).toFixed(1);
        readoutEl.innerHTML =
          `${previewItem ? previewItem.label : task.label} — arm-only draft`
          + `<br><b>${seconds}s</b> path · no module or physics check`;
        return;
      }
      const jid = mujoco.mj_name2id(mjModel, MJ_OBJ_JOINT, task.watch);
      const value = mjData.qpos[mjModel.jnt_qposadr[jid]];
      const slide = mjModel.jnt_type[jid] === MJ_JNT_SLIDE;

      const shown = slide
        ? `${(value * 1000).toFixed(1)} mm`
        : `${(((value * 180 / Math.PI + 180) % 360 + 360) % 360 - 180).toFixed(0)}°`;
      const seconds = (task.qpos.length / task.rate).toFixed(1);
      // A best-effort run is still shipped so the platform has something to
      // show; say so rather than let it read as a solved task.
      const short = task.ok === false ? ' · falls short of the goal' : '';
      readoutEl.innerHTML =
        `${task.caption}<br>joint <b>${shown}</b> · <b>${seconds}s</b> path${short}`;
    }

    function buildTaskList() {
      const select = document.getElementById('task-select');
      select.replaceChildren();
      task = null;
      previewItem = null;
      clearModulePreview();
      drawPath();
      for (const item of TASK_CATALOGUE) {
        const entry = item.traj ? trajectories[item.traj] : null;
        const opt = document.createElement('option');
        opt.value = item.key;
        opt.textContent = entry ? entry.label : `${item.label} — soon`;
        if (!entry) {
          opt.classList.add('pending');
          if (!PLACE_EDIT) opt.disabled = true;
        }
        select.appendChild(opt);
      }
      select.onchange = () => {
        const item = TASK_CATALOGUE.find((t) => t.key === select.value);
        if (!item) return;
        if (item.traj && trajectories[item.traj]) selectTask(item.traj);
        else if (PLACE_EDIT) previewModule(item);
      };
      setModuleVisibility(null);
    }

    function revealChip(btn, strip) {
      if (!btn || strip.scrollWidth <= strip.clientWidth) return;
      const pad = 8;
      const left = btn.offsetLeft - strip.offsetLeft - pad;
      const right = left + btn.offsetWidth + 2 * pad - strip.clientWidth;
      if (left < strip.scrollLeft) strip.scrollLeft = left;
      else if (right > strip.scrollLeft) strip.scrollLeft = right;
    }

    function buildRobotList() {
      const list = document.getElementById('robot-list');
      list.replaceChildren();
      for (const entry of catalogue) {
        // A platform with no trajectory yet is still worth showing -- you can
        // select it and look at the robot against the board -- so the gate is
        // only for the ones deliberately held back.
        const isSoon = !!entry.soon || (!PLACE_EDIT && entry.name === 'macao');
        const btn = document.createElement('button');
        btn.innerHTML = `${entry.label}<small>${isSoon ? 'coming soon' : entry.note}</small>`;
        btn.dataset.robot = entry.name;
        btn.disabled = isSoon;
        if (!isSoon || PLACE_EDIT) {
          btn.addEventListener('click', async () => {
            if (robot && robot.name === entry.name) return;
            setPlaying(false);
            const strip = document.getElementById('platforms');
            document.querySelectorAll('#robot-list button').forEach((b) => {
              b.classList.toggle('active', b.dataset.robot === entry.name);
              if (b.dataset.robot === entry.name) revealChip(b, strip);
            });
            await loadRobot(entry);
            const first = Object.keys(trajectories)[0];
            if (first) selectTask(first);
          });
        }
        list.appendChild(btn);
      }
    }

    function setPlaying(value) {
      if (value) {

        devHold = false;
        devPose = null;
        devObjectPose = null;
      }
      playing = !!value && !!task;
      playEl.textContent = playing ? 'Pause' : 'Play';
      playEl.classList.toggle('active', playing);
      syncControls();
    }

    function syncControls() {
      playEl.disabled = !task;
      const total = task ? task.qpos.length - 1 : 1;
      progressEl.style.width = task ? `${(100 * sampleIndex / total).toFixed(1)}%` : '0%';
    }

    function advance() {
      if (!playing || !task) return;
      if (++subStep < stepsPerSample) return;
      subStep = 0;
      if (sampleIndex < task.qpos.length - 1) {
        sampleIndex++;
      } else {

        resetScene();
      }
    }

    let lastTime = 0;
    let running = false;
    let tabVisible = !document.hidden;
    let inView = true;
    let uiSkip = 0;

    function start() {
      if (running || !mjModel || !tabVisible || !inView) return;
      running = true;
      lastTime = performance.now();
      requestAnimationFrame(animate);
    }

    function stop() {
      running = false;
    }

    function animate(time) {
      if (!running) return;
      requestAnimationFrame(animate);

      const dt = Math.min(time - lastTime, 50);
      lastTime = time;
      const steps = Math.min(Math.floor(dt / (mjModel.opt.timestep * 1000)), 30);

      for (let i = 0; i < steps; i++) {
        mujoco.mj_step1(mjModel, mjData);
        applyControl();
        mujoco.mj_step2(mjModel, mjData);
        advance();
      }

      if (applyDemoSample()) mujoco.mj_forward(mjModel, mjData);

      syncBodies();
      if (task) {
        pathMarker.position.copy(toThree(task.tcp[sampleIndex]));
      }
      if (++uiSkip >= 6) { uiSkip = 0; updateReadout(); syncControls(); }
      previewDemoStep(time);
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      if (!renderer) return;
      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    playEl.addEventListener('click', () => {
      if (!task) return;
      if (!playing && sampleIndex >= task.qpos.length - 1) resetScene();
      setPlaying(!playing);
      hintEl.style.opacity = '0';
    });

    document.getElementById('reset').addEventListener('click', () => {
      setPlaying(false);
      resetScene();
      syncControls();
    });

    document.addEventListener('visibilitychange', () => {
      tabVisible = !document.hidden;
      if (tabVisible && inView) start(); else stop();
    });

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'hiveboard-sim-visibility') return;
      inView = !!e.data.visible;
      if (tabVisible && inView) start(); else stop();
    });

    (async function init() {
      try {
        await startMujoco();
        await loadScene();
        buildScene();
        buildRobotList();

        const requestedRobot = new URLSearchParams(location.search).get('robot');
        const opening = catalogue.find((r) => r.name === requestedRobot && !r.soon && r.tasks.length)
          || catalogue.find((r) => !r.soon && r.tasks.length);
        const strip = document.getElementById('platforms');
        document.querySelectorAll('#robot-list button').forEach((b) => {
          b.classList.toggle('active', b.dataset.robot === opening.name);
          if (b.dataset.robot === opening.name) revealChip(b, strip);
        });
        await loadRobot(opening);

        const first = Object.keys(trajectories)[0];
        if (first) selectTask(first);
        syncControls();

        hintEl.style.opacity = '1';

        new ResizeObserver(onResize).observe(stageEl);

        status('Ready', 1);
        overlayEl.classList.add('hidden');
        setTimeout(() => { hintEl.style.opacity = '0'; }, 9000);
        start();

        if (new URLSearchParams(location.search).has('edit')) {
          import('./edit.js').then((editor) => editor.attach({
            THREE, scene, camera, renderer, controls, toThree,
            resetScene, drawPath, setPlaying, setTrajectoryPending, replaceTrajectory,
            setSample(i) {
              if (!task) return;
              devHold = true;
              devPose = null;
              devObjectPose = null;
              sampleIndex = Math.max(0, Math.min(i, task.qpos.length - 1));
              subStep = 0;
              teleportSample();
            },
            setEditorPose(qpos, grip) {
              if (!task || !Array.isArray(qpos)) return;
              devHold = true;
              setPlaying(false);
              devPose = { qpos, grip };
              devObjectPose = null;
              for (let i = 0; i < robot.arm; i++) mjData.qpos[i] = qpos[i];
              mjData.qvel.fill(0);
              mujoco.mj_forward(mjModel, mjData);
              syncBodies();
            },
            setEditorObjectPose(qpos) {
              if (!task || !Array.isArray(qpos)) return;
              devHold = true;
              setPlaying(false);
              devPose = null;
              devObjectPose = qpos;
              const prefix = `${task.watch.split('_')[0]}_`;
              let oi = 0;
              for (let jid = 0; jid < mjModel.njnt && oi < qpos.length; jid++) {
                const name = mjModel.joint(jid).name;
                if (name && name.startsWith(prefix)) {
                  mjData.qpos[mjModel.jnt_qposadr[jid]] = qpos[oi++];
                }
              }
              mjData.qvel.fill(0);
              mujoco.mj_forward(mjModel, mjData);
              syncBodies();
            },

            setDraftTrajectory(key, traj) {
              if (!traj) return;
              traj.watch = traj.watch || '';
              traj.armOnly = true;
              trajectories[key] = traj;
              task = traj;
              demoStateQposAddrs = [];
              setDemoCollisions(true);
              resetScene();
              drawPath();
              updateReadout();
            },
            get robot() { return robot; },
            get task() { return task; },
            get previewItem() { return previewItem; },
            get trajectories() { return trajectories; },
            get sample() { return sampleIndex; },
          })).catch(console.error);
        }

        if (window.parent !== window) {
          window.parent.postMessage({ type: 'hiveboard-sim-ready' }, '*');
        }
      } catch (err) {
        fail(err);
      }
    })();
  </script>
</body>

</html>
